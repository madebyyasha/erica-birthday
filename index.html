<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07142f">
  <title>A Birthday Wish</title>
  <meta name="description" content="A birthday wish written in the stars.">
  <link rel="stylesheet" href="styles.css?v=sterre-3">
</head>
<body>
  <main class="experience">
    <section id="night" class="scene night active" aria-label="Make a wish upon a star">
      <div class="aurora"></div><div id="stars" class="stars"></div>
      <div class="night-copy"><p>Make a wish</p><h1>upon a star…</h1></div>
      <button id="wishStar" class="wish-star" aria-label="Touch the wishing star"><span>✦</span><small>Touch the star</small></button>
      <div id="starTrail" class="star-trail" aria-hidden="true"></div>
      <div class="night-hills" aria-hidden="true"></div>
    </section>

    <section id="picnic" class="scene picnic" aria-label="A birthday picnic in Rotterdam">
      <img class="picnic-picture" src="assets/picnic-morning.png?v=4" alt="A sunny birthday picnic with a friend and Panna">
      <div class="sun-wash" aria-hidden="true"></div>
      <p class="picnic-line">Some wishes are better shared.</p>
      <div id="cakeWrap" class="cake-wrap" aria-label="A three-tier birthday cake">
        <i id="lightingStar" class="lighting-star" aria-hidden="true">✦</i>
        <div class="candle-row candles-top" aria-hidden="true"><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i></div>
        <div class="cake-tier tier-top"></div>
        <div class="candle-row candles-middle" aria-hidden="true"><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i></div>
        <div class="cake-tier tier-middle"></div>
        <div class="candle-row candles-bottom" aria-hidden="true"><i class="candle"></i><i class="candle"></i><i class="candle"></i><i class="candle"></i></div>
        <div class="cake-tier tier-bottom"></div><div class="cake-stand"></div>
      </div>
      <div id="blowPanel" class="blow-panel">
        <p>Make one last wish…</p>
        <button id="blow" class="button">Blow out the candles</button>
      </div>
    </section>

    <section id="finale" class="scene finale" aria-label="Birthday finale">
      <div class="final-bg"></div><canvas id="confetti" aria-hidden="true"></canvas>
      <div class="final-card"><p>May every wish find its way to you.</p><h2>Happy Birthday,<br><span>Erico!</span></h2><i class="final-star">✦</i></div>
      <button id="replay" class="replay">Make another wish</button>
    </section>
    <div class="grain" aria-hidden="true"></div>
  </main>
  <script src="script.js?v=sterre-3"></script>
</body>
</html>
